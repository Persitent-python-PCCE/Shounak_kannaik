{% extends "base.html" %}

{% block title %}500 Internal Error - Ticket Booking System{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm p-4">
            <h1 class="display-4 text-danger">500</h1>
            <h2 class="h4 mb-3">Internal Server Error</h2>
            <p class="text-muted mb-4">An unexpected error occurred while processing your request. Please try again later.</p>
            <div>
                <a href="{{ url_for('events_web.list_events') }}" class="btn btn-primary">Return to Events</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
