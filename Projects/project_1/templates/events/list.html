{% extends "base.html" %}

{% block title %}Events - Ticket Booking App{% endblock %}

{% block content %}
<section class="events-container">
    <h2>Available Events</h2>
    {% if events %}
        <ul>
        {% for event in events %}
            <li>Event #{{ event.id }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No events scheduled currently.</p>
    {% endif %}
</section>
{% endblock %}
