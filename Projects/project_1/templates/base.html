<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ticket Booking App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('event_controller.list_events') }}">Events</a>
            <a href="{{ url_for('booking_controller.list_bookings') }}">My Bookings</a>
            <a href="{{ url_for('auth_controller.login') }}">Login</a>
            <a href="{{ url_for('admin_controller.dashboard') }}">Admin</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Ticket Booking System. All rights reserved.</p>
    </footer>
</body>
</html>
