{% extends "base.html" %}

{% block title %}403 Forbidden - Ticket Booking System{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm p-4">
            <h1 class="display-4 text-danger">403</h1>
            <h2 class="h4 mb-3">Access Forbidden</h2>
            <p class="text-muted mb-4">You do not have the required permissions to view or perform this action.</p>
            <div>
                <a href="{{ url_for('events_web.list_events') }}" class="btn btn-primary">Return to Events</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
